[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "module_Olist"
version = "0.0.1"
description = "Brazilian e-commerce public dataset"
authors = [
  { name = "HugoMamona" },
]
readme = "README.md"
requires-python = "==3.12.13"
classifiers = [
    "Programming Language :: Python :: 3",
]

dependencies = [
    "fg-data-profiling>=4.19.1",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
    "jupyterlab",
    "loguru",
    "matplotlib",
    "numpy",
    "pandas",
    "python-dotenv",
    "scikit-learn",
    "seaborn>=0.13.2",
    "setuptools<70",
    "tqdm",
    "typer",
]

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.ruff]
line-length = 99
src = ["module_Olist"]
include = ["pyproject.toml", "module_Olist/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["module_Olist"]
force-sort-within-sections = true
